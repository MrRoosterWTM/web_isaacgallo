<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex"
    >

    <title>
        Página no encontrada | Isaac Gallo
    </title>

    <link
        rel="icon"
        type="image/png"
        href="/assets/images/logo_lico.png"
    >


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/css/404.css"
    >

    <link
        rel="stylesheet"
        href="/css/cookies.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header
        class="site-header"
        id="siteHeader"
    >

        <nav class="main-nav">


            <!-- LOGO -->

            <a
                href="/"
                class="logo"
                aria-label="Isaac Gallo - Inicio"
            >

                <img
                    src="/assets/images/logo_lico.png"
                    alt="Isaac Gallo"
                >

            </a>



            <!-- NAVEGACIÓN ESCRITORIO -->

            <div class="nav-links">

                <a href="/sobre-mi/">
                    Sobre mí
                </a>

                <a href="/proyectos/">
                    Proyectos
                </a>

                <a href="/servicios/">
                    Servicios
                </a>

                <a href="/contacto/">
                    Contacto
                </a>

            </div>



            <!-- HAMBURGUESA -->

            <button
                class="menu-toggle"
                id="menuToggle"
                type="button"
                aria-label="Abrir menú"
                aria-expanded="false"
                aria-controls="mobileMenu"
            >

                <span></span>
                <span></span>
                <span></span>

            </button>


        </nav>



        <!-- =================================================
             MENÚ MÓVIL
        ================================================== -->

        <div
            class="mobile-menu"
            id="mobileMenu"
        >

            <div class="mobile-menu-inner">

                <a href="/sobre-mi/">
                    Sobre mí
                </a>

                <a href="/proyectos/">
                    Proyectos
                </a>

                <a href="/servicios/">
                    Servicios
                </a>

                <a href="/blog/">
                    Blog
                </a>

                <a href="/contacto/">
                    Contacto
                </a>

            </div>

        </div>


    </header>



    <!-- =====================================================
         404
    ====================================================== -->

    <main class="error-page">


        <!-- IMAGEN DE DAVID -->

        <div
            class="error-david"
            aria-hidden="true"
        ></div>


        <!-- VELO BLANCO -->

        <div
            class="error-overlay"
            aria-hidden="true"
        ></div>


        <!-- CONTENIDO -->

        <section class="error-content">

            <p class="error-code">
                404
            </p>

            <h1>
                Miguel Ángel tiene dudas
                sobre esta página.
            </h1>

            <p class="error-description">
                Puede que se haya movido,
                que ya no exista o que nunca
                llegara a esculpirse.
            </p>

            <a
                href="/"
                class="error-button"
            >
                Volver al inicio
            </a>

        </section>


    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="/js/cookies.js"></script>
    <script src="/js/main.js"></script>


</body>

</html>
